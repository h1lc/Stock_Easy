server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # TLS : ce conteneur ne termine pas le chiffrement. En production, HTTPS est
    # assure en amont (reverse proxy ou repartiteur de charge), qui transmet la
    # requete en clair sur le reseau interne de Docker. Une fois le certificat
    # en place, decommenter HSTS ci-dessous — l'activer sans TLS rendrait le
    # site inaccessible pendant toute la duree du max-age.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Permet a Express (trust proxy) de savoir si la requete d'origine
        # etait en HTTPS, notamment pour les cookies "secure".
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing — toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
