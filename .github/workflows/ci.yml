name: StockEasy CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Tests backend
  # ──────────────────────────────────────────────
  test-server:
    name: Backend — Tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      # OWASP A06 — Composants vulnerables : echoue sur toute faille
      # de severite haute ou critique dans les dependances.
      - name: Audit des dependances
        run: npm audit --audit-level=high

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: test-secret-key-ci
          NODE_ENV: test
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/

  # ──────────────────────────────────────────────
  # 2. Lint et tests frontend
  # ──────────────────────────────────────────────
  test-client:
    name: Frontend — Lint et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      # Seules les dependances embarquees dans le bundle livre sont
      # bloquantes. Les outils de developpement (Vite, Vitest) ne sont jamais
      # deployes : ils sont verifies ensuite a titre informatif.
      - name: Audit des dependances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complet (informatif)
        run: npm audit || true

      # Comme cote backend, des seuils de couverture bloquants garantissent
      # que les tests suivent les evolutions du code.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: client/coverage/

  # ──────────────────────────────────────────────
  # 3. Build des images Docker (uniquement sur main)
  # ──────────────────────────────────────────────
  build-docker:
    name: Build — Images Docker
    runs-on: ubuntu-latest
    needs: [test-server, test-client]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Les images sont construites pour valider les Dockerfile, sans etre
      # publiees : aucune authentification a un registre n'est requise.
      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: stockeasy/server:${{ github.sha }},stockeasy/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: stockeasy/client:${{ github.sha }},stockeasy/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 4. Déploiement (actif uniquement si un serveur est configuré)
  # ──────────────────────────────────────────────
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      # Le contexte `secrets` n'est pas accessible dans le `if` d'un job : la
      # condition est donc portee par les etapes. Sans serveur cible declare,
      # le job reussit sans rien deployer, plutot que d'echouer sur une
      # connexion SSH impossible.
      - name: Verifier la configuration de deploiement
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun serveur de deploiement configure (secret DEPLOY_HOST absent) — etape ignoree."
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/stockeasy
            git pull origin main
            docker compose up -d --build
            docker compose exec -T server npx prisma migrate deploy
            docker image prune -f
